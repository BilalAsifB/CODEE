name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend-test:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./codee-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './codee-backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npx prettier --check "src/**/*.js"

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
          NODE_ENV: test
          PORT: 5000
          CACHE_ENABLED: true
          CACHE_TTL: 3600
          MODEL_ID_3B: bilalburney/qwen2.5-3b-coder-alpaca
          MODEL_ID_0_5B: bilalburney/qwen2.5-0.5b-coder-alpaca
          LOG_LEVEL: error
          STREAMING_ENABLED: false

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: ./codee-backend/coverage/
          retention-days: 30

      - name: Display coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json
          fi
