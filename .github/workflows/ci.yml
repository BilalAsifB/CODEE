name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./codee-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './codee-backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.js"

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
          NODE_ENV: test
          PORT: 5000
          CACHE_ENABLED: true
          CACHE_TTL: 3600
          MODEL_ID_3B: bilalburney/qwen2.5-3b-coder-alpaca
          MODEL_ID_0_5B: bilalburney/qwen2.5-0.5b-coder-alpaca
          LOG_LEVEL: error
          STREAMING_ENABLED: false

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: ./codee-backend/coverage/
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./codee-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './codee-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=0 || echo "ESLint not configured, skipping..."

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false --passWithNoTests
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:5000/api
          REACT_APP_DEBUG: false

      - name: Build application
        run: npm run build
        env:
          REACT_APP_API_BASE_URL: http://localhost:5000/api
          REACT_APP_DEBUG: false

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: ./codee-frontend/coverage/
          retention-days: 30

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./codee-frontend/build/
          retention-days: 7

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed successfully!"
