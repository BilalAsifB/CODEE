name: Frontend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  frontend-test:
    name: Frontend Tests, Build & Quality Checks
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./codee-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './codee-frontend/package-lock.json'

      - name: Install dependencies
        run: npm install --frozen-lockfile

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=0 || echo "ESLint not configured, skipping..."

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false --passWithNoTests
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:5000/api
          REACT_APP_DEBUG: false

      - name: Build application
        run: npm run build
        env:
          REACT_APP_API_BASE_URL: http://localhost:5000/api
          REACT_APP_DEBUG: false

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: ./codee-frontend/coverage/
          retention-days: 30

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./codee-frontend/build/
          retention-days: 7
